name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # можно запускать вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # ============================================
      # Здесь будет сборка твоего проекта
      # Пока заглушка — потом добавим реальную сборку
      # ============================================

      - name: Build APK (placeholder)
        run: |
          echo "Сюда потом добавим реальную команду сборки"
          echo "Сейчас workflow просто проверяет, что SDK ставится нормально"

