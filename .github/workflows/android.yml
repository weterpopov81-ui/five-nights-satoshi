name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install NDK and CMake
      run: |
        sdkmanager "ndk;26.1.10909125"
        sdkmanager "cmake;3.22.1"
    
    - name: Clone raymob template
      run: |
        cd /tmp
        git clone https://github.com/Bigfoot71/raymob.git
        cd raymob
        chmod +x gradlew
    
    - name: Copy game files
      run: |
        cp main.cpp /tmp/raymob/app/src/main/cpp/
        cp menu.cpp /tmp/raymob/app/src/main/cpp/
        cp menu.h /tmp/raymob/app/src/main/cpp/
        mkdir -p /tmp/raymob/app/src/main/assets
        cp *.mp3 /tmp/raymob/app/src/main/assets/ || true
        cp *.glb /tmp/raymob/app/src/main/assets/ || true
        cp *.png /tmp/raymob/app/src/main/assets/ || true
        cp *.jpg /tmp/raymob/app/src/main/assets/ || true
    
    - name: Build APK
      run: |
        cd /tmp/raymob
        ./gradlew assembleDebug --stacktrace
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: five-nights-satoshi-apk
        path: /tmp/raymob/app/build/outputs/apk/debug/app-debug.apk
