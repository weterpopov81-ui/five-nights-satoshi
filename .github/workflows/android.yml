name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK and CMake
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

    - name: Clone raymob template
      run: |
        git clone --depth 1 https://github.com/Bigfoot71/raymob.git /tmp/raymob
        cd /tmp/raymob
        chmod +x gradlew

    - name: Configure NDK path for Gradle
      run: |
        echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> /tmp/raymob/local.properties
        echo "cmake.dir=$ANDROID_HOME/cmake/3.22.1" >> /tmp/raymob/local.properties
        echo "sdk.dir=$ANDROID_HOME" >> /tmp/raymob/local.properties

    - name: Copy game files
      run: |
        cp main.cpp /tmp/raymob/app/src/main/cpp/
        cp menu.cpp /tmp/raymob/app/src/main/cpp/
        cp menu.h /tmp/raymob/app/src/main/cpp/
        mkdir -p /tmp/raymob/app/src/main/assets
        cp *.mp3 /tmp/raymob/app/src/main/assets/ || true
        cp *.glb /tmp/raymob/app/src/main/assets/ || true
        cp *.png /tmp/raymob/app/src/main/assets/ || true
        cp *.jpg /tmp/raymob/app/src/main/assets/ || true

    - name: Build APK (debug)
      run: |
        cd /tmp/raymob
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: five-nights-satoshi-apk
        path: /tmp/raymob/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
